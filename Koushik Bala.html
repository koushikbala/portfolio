<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Koushik Bala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: cream canvas, dotted rotating globe with coral arcs behind one centered column (name over title).
     Claude design system: Copernicus-style serif display (Cormorant Garamond substitute), Inter body. */
  :root {
    --bg: #faf9f5;
    --fg: #141413;
    --body: #3d3d3a;
    --muted: #6c6a64;
    --accent: #cc785c;
    --font-display: Copernicus, "Tiempos Headline", "Cormorant Garamond", Garamond, "Times New Roman", serif;
    --font-sans: StyreneB, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
  }
  #globe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }
  /* Frame border: crisp coral line with a soft glow and a light that travels around it */
  @property --frame-angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .frame {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    left: max(12px, env(safe-area-inset-left, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    z-index: 2;
    pointer-events: none;
    border-radius: 16px;
    border: 1px solid rgba(204, 120, 92, 0.38);
    box-shadow: 0 0 22px rgba(204, 120, 92, 0.16), inset 0 0 26px rgba(204, 120, 92, 0.10);
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 2px;
    background: conic-gradient(from var(--frame-angle), transparent 0%, transparent 62%, rgba(204, 120, 92, 0.95) 82%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    filter: drop-shadow(0 0 5px rgba(204, 120, 92, 0.75));
  }
  @media (prefers-reduced-motion: no-preference) {
    .frame::before { animation: frame-spin 7s linear infinite; }
    @keyframes frame-spin { to { --frame-angle: 360deg; } }
  }
  main {
    position: relative;
    z-index: 1;
    padding-inline: 20px;
    width: 100%;
    max-width: 820px;
    min-width: 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(2.75rem, 12vw, 5rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--fg);
    text-wrap: balance;
  }
  .rule {
    width: 64px;
    height: 2px;
    background: var(--accent);
  }
  p {
    margin: 0;
    font-size: clamp(1rem, 3.8vw, 1.25rem);
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0;
    color: var(--body);
    text-wrap: balance;
  }
  p .plus { color: var(--accent); }
  /* Writing animation: name rises in letter by letter, title types out with a coral caret */
  .word { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; }
  @media (prefers-reduced-motion: no-preference) {
    .ch {
      animation: letter 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      animation-delay: calc(var(--i) * 55ms + 150ms);
    }
    .tc {
      animation: type 0.01s steps(1) both;
      animation-delay: calc(var(--i) * 38ms + 1300ms);
    }
    p.typing::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1.05em;
      margin-left: 4px;
      vertical-align: -0.15em;
      background: var(--accent);
      opacity: 0;
      animation: blink 1.1s steps(1) infinite;
      animation-delay: var(--caret-delay, 2.6s);
    }
    @keyframes letter {
      from { opacity: 0; transform: translateY(0.35em); filter: blur(6px); }
      to { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes type { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  }
  @media (prefers-reduced-motion: no-preference) {
    main > * { animation: rise 0.7s ease-out both; }
    main > .rule { animation-delay: 0.12s; }
    main > p { animation-delay: 0.24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }
</style>

<canvas id="globe" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"></div>
<main>
  <h1>Koushik Bala</h1>
  <div class="rule" aria-hidden="true"></div>
  <p>Full Stack AI Engineer <span class="plus">+</span> DevOps</p>
</main>

<script>
(function () {
  var canvas = document.getElementById("globe");
  var ctx = canvas.getContext("2d");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var w = 0, h = 0, dpr = 1, R = 200, cx = 0, cy = 0;
  var TILT = 0.38;
  var rot = -88 * Math.PI / 180; // start with India facing the viewer
  var SEGMENTS = 56;
  var TEAL = "204,120,92";   // coral arcs
  var DOT = "108,106,100";   // warm gray globe dots
  var HALO = "232,224,210";  // cream-strong sphere shading

  // [lat, lon] of cities the arcs connect
  var KOLKATA = [22.57, 88.36];
  var CITIES = [
    [51.51, -0.13], [40.71, -74.0], [37.77, -122.42], [1.35, 103.82],
    [35.68, 139.69], [-33.87, 151.21], [25.2, 55.27], [-23.55, -46.63],
    [52.52, 13.4], [-33.92, 18.42], [19.07, 72.88], [55.75, 37.62]
  ];

  function toVec(ll) {
    var la = ll[0] * Math.PI / 180, lo = ll[1] * Math.PI / 180;
    return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
  }

  // Evenly spaced points on a sphere (Fibonacci lattice)
  var dots = [];
  function buildDots(n) {
    dots = [];
    var golden = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < n; i++) {
      var y = 1 - (i / (n - 1)) * 2;
      var r = Math.sqrt(1 - y * y);
      var t = golden * i;
      dots.push([Math.cos(t) * r, y, Math.sin(t) * r]);
    }
  }

  var arcs = [];
  function newArc(arc, startP) {
    var from = Math.random() < 0.55 ? KOLKATA : CITIES[Math.floor(Math.random() * CITIES.length)];
    var to = CITIES[Math.floor(Math.random() * CITIES.length)];
    if (from === to) to = KOLKATA;
    var a = toVec(from), b = toVec(to);
    var dot = Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]));
    var omega = Math.acos(dot);
    arc = arc || {};
    arc.a = a; arc.b = b; arc.omega = omega;
    arc.lift = 0.08 + 0.22 * (omega / Math.PI);
    arc.p = startP;
    arc.speed = 0.0055 + Math.random() * 0.003;
    return arc;
  }

  function arcPoint(arc, t) {
    var so = Math.sin(arc.omega) || 1e-6;
    var k1 = Math.sin((1 - t) * arc.omega) / so, k2 = Math.sin(t * arc.omega) / so;
    var s = 1 + arc.lift * Math.sin(Math.PI * t);
    return [(arc.a[0] * k1 + arc.b[0] * k2) * s, (arc.a[1] * k1 + arc.b[1] * k2) * s, (arc.a[2] * k1 + arc.b[2] * k2) * s];
  }

  var cr = 1, sr = 0, ct = Math.cos(TILT), st = Math.sin(TILT);
  function setRotation() { cr = Math.cos(rot); sr = Math.sin(rot); }
  // returns [screenX, screenY, depth]
  function project(v) {
    var x = v[0] * cr + v[2] * sr;
    var z1 = -v[0] * sr + v[2] * cr;
    var y = v[1] * ct - z1 * st;
    var z = v[1] * st + z1 * ct;
    return [cx + x * R, cy - y * R, z];
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = w / 2; cy = h / 2;
    R = Math.min(w * 0.46, h * 0.46);
    buildDots(Math.max(500, Math.min(1700, Math.round(R * R / 55))));
  }

  function drawArc(arc) {
    var head = Math.min(arc.p, 1), tail = Math.max(0, arc.p - 0.45);
    if (head <= 0 || tail >= head) return;
    var span = head - tail, steps = Math.max(2, Math.round(SEGMENTS * span));
    var prev = null, i, t, pt;
    ctx.lineWidth = 1.6; ctx.lineCap = "round";
    for (i = 0; i <= steps; i++) {
      t = tail + span * (i / steps);
      pt = project(arcPoint(arc, t));
      if (prev && pt[2] > 0 && prev[2] > 0) {
        var f = i / steps; // 0 at tail, 1 at head
        ctx.strokeStyle = "rgba(" + TEAL + "," + (0.08 + 0.85 * f * f).toFixed(3) + ")";
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(pt[0], pt[1]); ctx.stroke();
      }
      prev = pt;
    }
    // bright head
    if (prev && prev[2] > 0 && arc.p <= 1) {
      ctx.fillStyle = "rgba(" + TEAL + ",1)";
      ctx.beginPath(); ctx.arc(prev[0], prev[1], 2.6, 0, Math.PI * 2); ctx.fill();
    }
    // landing ping
    if (arc.p > 1) {
      var end = project(arcPoint(arc, 1));
      if (end[2] > 0) {
        var q = Math.min(1, (arc.p - 1) / 0.5);
        ctx.strokeStyle = "rgba(" + TEAL + "," + (0.7 * (1 - q)).toFixed(3) + ")";
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(end[0], end[1], 2 + q * 14, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(" + TEAL + ",0.9)";
        ctx.beginPath(); ctx.arc(end[0], end[1], 2.4, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    setRotation();
    // faint halo so the sphere reads against white
    var g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.04);
    g.addColorStop(0, "rgba(" + HALO + ",0.00)");
    g.addColorStop(0.85, "rgba(" + HALO + ",0.35)");
    g.addColorStop(1, "rgba(" + HALO + ",0.85)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.04, 0, Math.PI * 2); ctx.fill();

    var i, p, a;
    for (i = 0; i < dots.length; i++) {
      p = project(dots[i]);
      if (p[2] <= 0) continue;
      a = 0.12 + 0.38 * p[2];
      ctx.fillStyle = "rgba(" + DOT + "," + a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(p[0], p[1], 0.9 + 0.7 * p[2], 0, Math.PI * 2); ctx.fill();
    }
    for (i = 0; i < arcs.length; i++) drawArc(arcs[i]);
  }

  function loop() {
    rot += 0.0022;
    for (var i = 0; i < arcs.length; i++) {
      arcs[i].p += arcs[i].speed;
      if (arcs[i].p > 1.5) newArc(arcs[i], -Math.random() * 0.6);
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", function () { resize(); if (reduce) draw(); });

  resize();
  for (var n = 0; n < 6; n++) arcs.push(newArc(null, n * 0.22 - 0.1));
  if (reduce) { for (var m = 0; m < arcs.length; m++) arcs[m].p = 1.05; draw(); }
  else { requestAnimationFrame(loop); }
})();
</script>
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var h1 = document.querySelector("h1");
  var p = document.querySelector("main p");
  var idx = 0;

  // Name: one span per letter, grouped by word so lines only break between words
  var name = h1.textContent.trim();
  h1.setAttribute("aria-label", name);
  h1.textContent = "";
  name.split(" ").forEach(function (word, wi, words) {
    var wrap = document.createElement("span");
    wrap.className = "word";
    wrap.setAttribute("aria-hidden", "true");
    word.split("").forEach(function (c) {
      var s = document.createElement("span");
      s.className = "ch";
      s.style.setProperty("--i", idx++);
      s.textContent = c;
      wrap.appendChild(s);
    });
    h1.appendChild(wrap);
    if (wi < words.length - 1) { h1.appendChild(document.createTextNode(" ")); idx++; }
  });

  // Title: type each character, keeping the coral plus sign
  var label = p.textContent.replace(/\s+/g, " ").trim();
  p.setAttribute("aria-label", label);
  var ti = 0;
  function typeNode(node, parent) {
    if (node.nodeType === 3) {
      node.textContent.split(" ").forEach(function (word, wi, words) {
        if (word) {
          var wrap = document.createElement("span");
          wrap.className = "word";
          wrap.setAttribute("aria-hidden", "true");
          word.split("").forEach(function (c) {
            var s = document.createElement("span");
            s.className = "tc";
            s.style.setProperty("--i", ti++);
            s.textContent = c;
            wrap.appendChild(s);
          });
          parent.appendChild(wrap);
        }
        if (wi < words.length - 1) { parent.appendChild(document.createTextNode(" ")); ti++; }
      });
    } else {
      var el = node.cloneNode(false);
      Array.prototype.slice.call(node.childNodes).forEach(function (child) { typeNode(child, el); });
      parent.appendChild(el);
    }
  }
  var kids = Array.prototype.slice.call(p.childNodes);
  p.textContent = "";
  kids.forEach(function (k) { typeNode(k, p); });
  p.style.setProperty("--caret-delay", (1300 + ti * 38 + 200) + "ms");
  p.classList.add("typing");
})();
</script>

</body></html>
